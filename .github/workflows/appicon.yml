# AppIcon —— 双切片（arm64 + arm64e）deb 的云编译与发布。
#
# 包结构对照 ThemeCore 0.5.1：单 dylib + 同名过滤器 plist，外加设置面板 bundle
# （Preferences 面板 + PreferenceLoader 入口），Architecture 写 iphoneos-arm64e，
# postinst/postrm 同形状。
#
# 为什么必须云编译：开发机 iPhone10,1（A11 / iOS 16.7.16 / roothide）缺 FEAT_LRCPC，
# 装不了 Command Line Tools，本机编不出任何东西。
#
# 版本三处必须一致：ThemeCoreX/Sources/TCXVersion.h、scripts/build-appicon.sh、下面的 env.VERSION。

name: Build AppIcon

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'ThemeCoreX/**'
      - 'Prefs/**'
      - 'Support/AppIcon.plist'
      - 'Support/AppIconPreferenceLoader.plist'
      - 'scripts/build-appicon.sh'
      - '.github/workflows/appicon.yml'

permissions:
  contents: write

concurrency:
  group: appicon-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages
  VERSION: 0.0.16

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout
        uses: actions/checkout@v4

      # 私有头（vendor/include）与预编的 CydiaSubstrate.framework（vendor/lib）都在这里。
      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Verify version consistency
        run: |
          set -euo pipefail
          HEADER_VERSION=$(grep -E '^#define TCX_VERSION' ThemeCoreX/Sources/TCXVersion.h | sed -E 's/.*"(.*)".*/\1/')
          SCRIPT_VERSION=$(grep -E '^VERSION=' scripts/build-appicon.sh | head -n 1 | cut -d= -f2)
          echo "::notice title=version::header=$HEADER_VERSION script=$SCRIPT_VERSION env=$VERSION"
          for pair in "header:$HEADER_VERSION" "script:$SCRIPT_VERSION"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$VERSION" ]; then
              echo "::error title=version-mismatch::$name=$value 与 env.VERSION=$VERSION 不一致"
              exit 1
            fi
          done

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "sources sha256:"
          shasum -a 256 ThemeCoreX/Sources/* ThemeCoreX/Hooks/* ThemeCoreX/Headers/* Support/AppIcon.plist | sed 's/^/  /'
          if sh scripts/build-appicon.sh 2>&1 | tee /tmp/ai-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            # GitHub 每个 step 只留 10 条注解：报错压成一条多行注解。
            # grep 无匹配返回 1，在 pipefail + bash -e 下整步提前退出、注解写不出
            # （run 42004354714 只剩「exit code 1」）。这里关掉 -e。
            set +e
            ERRCOUNT=$(grep -cE "error:|fatal error|1 error generated\." /tmp/ai-build.log)
            {
              grep -E "error:|fatal error|1 error generated\." /tmp/ai-build.log | head -n 25
              echo "--- tail of build log ---"
              tail -n 15 /tmp/ai-build.log
            } | awk '{ gsub(/%/,"%25"); gsub(/\r/,""); print }' > /tmp/ai-errs.txt
            BODY=$(awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}' /tmp/ai-errs.txt)
            echo "::error title=build-appicon errlines=${ERRCOUNT:-0}::${BODY}"
            # 尾部逐行单独发，防多行注解被截断
            tail -n 8 /tmp/ai-build.log | while IFS= read -r line; do
              echo "::warning title=build-tail::${line}"
            done
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/appicon/out/AppIcon.dylib
          PREFS_EXE=build/appicon/out/AppIconPrefs
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices::$(lipo -info "$DY")"
          echo "::notice title=prefs-slices::$(lipo -info "$PREFS_EXE")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link::$lib"
          done
          DEB=$(ls packages/com.yangzhou.appicon_*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          echo "::notice title=control::$(dpkg-deb -f "$DEB" Package) $(dpkg-deb -f "$DEB" Version) $(dpkg-deb -f "$DEB" Architecture)"
          DEBVER=$(dpkg-deb -f "$DEB" Version)
          if [ "$DEBVER" != "$VERSION" ]; then
            echo "::error title=version-mismatch::deb=$DEBVER 期望=$VERSION"
            exit 1
          fi
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"

      - name: Publish release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: appicon-v${{ env.VERSION }}
          name: AppIcon v${{ env.VERSION }}
          body: |
            AppIcon v0.0.1 —— 轻量化桌面图标主题插件（验证实验版）。

            **架构对照 ThemeCore 0.5.1（com.susudear.themecore）**：单 dylib 挂
            `/Library/MobileSubstrate/DynamicLibraries/`，同名过滤器 plist
            （`com.apple.UIKit` + `iconservicesagent` / `ShareUI` / `sharingd`，Mode Any），
            `Architecture: iphoneos-arm64e`，`postinst` 建 `Library/Themes` 与
            `var/mobile/Library/Preferences` 并踢 sharingd。设置面板：
            `/Library/PreferenceBundles/AppIconPrefs.bundle` +
            `/Library/PreferenceLoader/Preferences/AppIcon/Root.plist`。

            功能：图标主题化、图标阴影、角标底板、时钟、日历、文件夹图标、控制中心图标。
            主题目录：`<jbroot>/Library/Themes/<主题>/`（`IconBundles/`、`Bundles/<bundle id>/`、
            `Bundles/AnemoneEffects/`）。
            诊断：`/var/mobile/Library/AppIcon/diag.txt`。
          files: |
            packages/com.yangzhou.appicon_${{ env.VERSION }}_iphoneos-arm64e.deb
            packages/AppIcon${{ env.VERSION }}-arm64e.deb