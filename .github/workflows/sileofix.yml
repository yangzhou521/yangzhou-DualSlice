# SileoFix —— 云编译与发布。
#
# 开发机 iPhone10,1（A11）没有工具链，一切走 macOS runner：clang 直编 arm64 + arm64e，
# ldid 签名，dpkg-deb 打包，并在同一次运行里发 Release。

name: Build SileoFix

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'SileoFix/**'
      - 'Support/SileoFix*'
      - 'scripts/build-sileofix.sh'
      - '.github/workflows/sileofix.yml'

permissions:
  contents: write

concurrency:
  group: sileofix-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      # 拿 SDK 和 vendor（libsubstrate）。
      - name: Checkout Theos (for the iPhoneOS SDK and substrate)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      # 版本三处必须一致：源码里的 SW_VERSION、构建脚本的 VERSION、这里的 tag。
      - name: Version consistency
        run: |
          set -euo pipefail
          SRC_V=$(sed -n 's/^#define SW_VERSION "\(.*\)"/\1/p' SileoFix/Sources/SileoFix.m)
          SH_V=$(sed -n 's/^VERSION=\(.*\)$/\1/p' scripts/build-sileofix.sh)
          WF_V=$(sed -n 's/^          tag_name: sileofix-v\(.*\)$/\1/p' .github/workflows/sileofix.yml)
          echo "src=$SRC_V script=$SH_V workflow=$WF_V"
          if [ -z "$SRC_V" ] || [ "$SRC_V" != "$SH_V" ] || [ "$SRC_V" != "$WF_V" ]; then
            echo "::error title=version-mismatch::SW_VERSION=$SRC_V VERSION=$SH_V tag=$WF_V"
            exit 1
          fi
          echo "::notice title=version::$SRC_V"

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "source sha256: $(shasum -a 256 SileoFix/Sources/*.m)"
          if sh scripts/build-sileofix.sh roothide 2>&1 | tee /tmp/sf-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            grep -E "error:|error |not found|undefined|ld: |clang: |fatal|No such file|missing" /tmp/sf-build.log \
              | head -n 8 > /tmp/sf-errs.txt || true
            tail -n 12 /tmp/sf-build.log >> /tmp/sf-errs.txt
            while IFS= read -r line; do
              echo "::error title=build-sileofix::$line"
            done < /tmp/sf-errs.txt
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/sileofix/out/SileoFix.dylib
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices::$(lipo -info "$DY")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link::$lib"
          done
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          dpkg-deb -c "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sileofix-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (sileofix-v1.0.2)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: sileofix-v1.0.2
          name: SileoFix v1.0.2
          body: |
            修 **SileoWallpaper** 壁纸插件导致的 Sileo 输入框失效：任意软件源页的
            「搜索软件包」点了没反应、键盘不弹、打不了字。

            v1.0.2 修掉 v1.0.1 的崩溃（点底栏「软件包」即闪退）：UITextField 与
            UISearchBar 的 `didMoveToWindow` 曾共用一个原 IMP 槽，第二站把槽覆盖成
            自己的原实现，于是文本框移动窗口时执行了 search bar 的实现，对着不是
            search bar 的对象发 `searchDisplayController` 而崩（KERN_INVALID_ADDRESS）。
            现在一站一槽。

            做法：只注入 Sileo。在输入控件中心做 hitTest，若命中的是「装饰盖板」
            （类名以 SW 开头 / 名字含 Backdrop、Effect / UIVisualEffectView /
            _UIBackdropView）而它既不是控件的祖先也不是子孙，就把这块盖板的
            userInteractionEnabled 设成 NO，触摸自然落到下面的输入框上。壁纸照旧，
            不改 SileoWallpaper 的安装内容，也不动 Sileo 自己的视图。

            若盖板类名认不出，还有一层兜底：窗口收到触摸时直接把焦点交给下面的控件。

            装后重启 Sileo 生效（`icli app kill org.coolstar.SileoStore --force`）。
            诊断：`icli log syslog --subsystem com.yangzhou.sileofix`，
            或读 Sileo 沙盒里的 `Caches/sileofix.log`。
          files: release/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls release/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/sileofix-v1.0.2/$(basename "$DEB")"