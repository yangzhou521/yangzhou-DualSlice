# ThemeCorePlus —— 双切片（arm64 + arm64e）deb 的云编译与发布。
#
# 为什么必须是云编译：开发机是 iPhone10,1（A11 / iOS 16.7.16 / roothide），A11 缺 FEAT_LRCPC，
# 装不了任何 Command Line Tools，本机编不出任何东西。macOS runner 上 clang 直编 arm64 + arm64e
# 两片再 lipo，ldid 签名，dpkg-deb 打包，然后在同一次运行里发成 Release。
#
# 版本是静态的：改版本时同时改 scripts/build-themecoreplus.sh 的 VERSION 与下面的 tag。
# 可读的验证信息都写成 check-run 的 annotation（::notice/::error title=…）：job 日志要登录才能看，
# 而公开仓库的 check-run annotations 匿名可读。

name: Build ThemeCorePlus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    # 只在本产品的文件变动时才跑，别把已经装机验证过的那份 deb 白白重建。
    paths:
      - 'ThemeCorePlus/**'
      - 'Prefs/**'
      - 'Support/ThemeCorePlus*.plist'
      - 'Support/ThemeCorePlus*.png'
      - 'scripts/build-themecoreplus.sh'
      - '.github/workflows/themecoreplus.yml'

permissions:
  contents: write

concurrency:
  group: themecoreplus-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages
  VERSION: 1.0.0

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Checkout
        uses: actions/checkout@v4

      # 私有头（vendor/include）与预编的 CydiaSubstrate.framework（vendor/lib）都在这里。
      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Verify version consistency
        run: |
          set -euo pipefail
          # tag 必须与包版本一致：2026-10-30 17:19 那次只改了脚本、工作流还写着旧 tag，
          # 新版 deb 被发进了旧的那个 Release（同一个 Release 现在挂着两个版本）。
          # 这里把它变成一条硬检查，三处不一致就不编、不发，免得再把包发错地方。
          HEADER_VERSION=$(grep -E '^#define TCP_VERSION' ThemeCorePlus/Sources/ThemeCorePlusVersion.h | sed -E 's/.*"(.*)".*/\1/')
          SCRIPT_VERSION=$(grep -E '^VERSION=' scripts/build-themecoreplus.sh | head -n 1 | cut -d= -f2)
          echo "::notice title=version::header=$HEADER_VERSION script=$SCRIPT_VERSION env=$VERSION"
          for pair in "header:$HEADER_VERSION" "script:$SCRIPT_VERSION"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$VERSION" ]; then
              echo "::error title=version-mismatch::$name=$value 与 env.VERSION=$VERSION 不一致"
              exit 1
            fi
          done
          WORKFLOW=.github/workflows/themecoreplus.yml
          TAGS=$(grep -c "themecoreplus-v$VERSION" "$WORKFLOW" || true)
          if [ "${TAGS:-0}" -lt 2 ]; then
            echo "::error title=version-mismatch::工作流里只出现 $TAGS 次 themecoreplus-v$VERSION"
            exit 1
          fi
          OTHER=$(grep -nE "themecoreplus-v[0-9]+\.[0-9]+\.[0-9]+" "$WORKFLOW" | grep -v "themecoreplus-v$VERSION" || true)
          if [ -n "$OTHER" ]; then
            echo "::error title=version-mismatch::工作流里还有别的 tag：$OTHER"
            exit 1
          fi

      - name: Build package
        run: |
          set -o pipefail
          # 打印提交与源码摘要：一次日志要能说清它编的是哪棵树。
          echo "commit: $(git rev-parse HEAD)"
          echo "build-themecoreplus.sh sha256: $(shasum -a 256 scripts/build-themecoreplus.sh)"
          echo "sources sha256:"
          shasum -a 256 ThemeCorePlus/Sources/*.m ThemeCorePlus/Sources/*.h Prefs/ThemeCorePlusPrefs/* | sed 's/^/  /'
          if sh scripts/build-themecoreplus.sh roothide 2>&1 | tee /tmp/tcp-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            # GitHub 每个 step 只留 10 条注解：报错必须压成**一条**多行注解，否则真正的编译错误
            # 会被后面的行挤掉（上一轮就是这么只看到 10 行、剩下的 TU 报什么全不知道）。
            # % → %25、换行 → %0A，都是注解里的转义要求。
            ERRCOUNT=$(grep -cE "error:|fatal error|1 error generated\." /tmp/tcp-build.log || true)
            {
              grep -E "error:|fatal error|1 error generated\." /tmp/tcp-build.log | head -n 25
              echo "--- tail of build log ---"
              tail -n 10 /tmp/tcp-build.log
            } | awk '{ gsub(/%/,"%25"); gsub(/\r/,""); print }' > /tmp/tcp-errs.txt
            BODY=$(awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}' /tmp/tcp-errs.txt)
            echo "::error title=build-themecoreplus errlines=${ERRCOUNT}::${BODY}"
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/themecoreplus/out/ThemeCorePlus.dylib
          PB=build/themecoreplus/out/ThemeCorePlusPrefs
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices-tweak::$(lipo -info "$DY")"
          echo "::notice title=slices-prefs::$(lipo -info "$PB")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-tweak::$lib"
          done
          otool -L "$PB" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-prefs::$lib"
          done
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          # 包名里的版本与 control 里的版本也一起核对：deb 名错了会让装机的人抓错文件。
          DEBVER=$(dpkg-deb -f "$DEB" Version)
          echo "::notice title=deb-version::$DEBVER"
          if [ "$DEBVER" != "$VERSION" ] || ! echo "$(basename "$DEB")" | grep -q "_${VERSION}_"; then
            echo "::error title=version-mismatch::deb=$(basename "$DEB") 版本=$DEBVER 期望=$VERSION"
            exit 1
          fi
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: themecoreplus-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (themecoreplus-v1.0.0)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        # 仓库的 Actions 权限只读时这里会 403；那样就走下面的匿名托管兜底，不让整轮失败。
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: themecoreplus-v1.0.0
          name: ThemeCorePlus v1.0.0
          body: |
            主题美化 +（ThemeCorePlus）v1.0.0 —— MarkTheme 式主题引擎，作者 yangzhou。

            **v1.0.0 精简重启版**：只加载图标 + 角标，砍掉布局保存/文件夹/文件/时钟日历；注销后自动生效。
            （下方 0.9.x 历史说明仅供参考，本版不再包含这些模块。）

            v0.9.31（**时钟/日历取证**）：用户 14:15 报时钟与日历图标一直没正常换过。诊断 `dyn{clock=0,cal=0,seen=0}`
            说明 `TCPCompositeDynamicIcon` 那条主链一次没被调用，`clockv{noface}` 说明视图层找表盘也失败。
            这一版只加取证、不改行为：① `dyn{}` 新增 `c[…]`，在 SpringBoard 进程内报
            `SBHClockApplicationIconImageView` / `SBHClockApplicationIcon` / `SBHCalendarApplicationIcon` / `SBIconImageView`
            四个类存不存在（外部 icli 探针看不到私有类，只能插件自己问）；② `clockv{}` 的 `noface`
            改为带上本视图尺寸与子视图树（类名|尺寸|图片尺寸，最多 8 条），一次装包就能定位表盘在哪一层、
            是不是根本不是 UIImageView。装完读这两项即可决定 0.9.32 怎么修时钟日历。

            v0.9.30（**主屏图标空/文件夹有 —— 根因修 + 安全网**）：参考开源实现 IconBundles（nickfrey，MIT）——
            它读主题 `Info.plist` 的 `IB-MaskIcons`，true 表示素材**已自带圆角与底**、引擎不该再套遮罩。
            本机「液态玻璃」主题正是 `IB-MaskIcons=true`，而它的 `AppIconMask` alpha 覆盖只有 0.14 ——
            拿那张几乎全透明的遮罩去裁不透明素材，主屏那一层就只剩一圈边（看着就是空），
            文件夹里走系统自己的渲染才看得见。本版：
            ① 读叠加链里任一层 Info.plist 的 `IB-MaskIcons`，为 true 时**彻底不用遮罩、也不补圆角兜底**；
            ② 新增**安全网**：合成结果若比原素材透明一半以上（源 cov>0.30 且结果 cov<源×0.5），
            直接退回原素材 —— 宁可显示系统图，也不显示空白；诊断 `fb{n=,last=bundleID:源cov→结果cov}`；
            ③ 诊断新增 `ibmask=0|1`，装完一读就知道有没有读到这个字段。
            另含 0.9.29 取证：普查时对「我们的」图标视图跑像素自检（`pix{}` 有数）、
            `tclear{n=,blank=[bundleID:cov…]}`、像素统计改按原图等比缩到 ≤256 再量。

            v0.9.28（**图标加载假阴性修复 · 续**）：0.9.27 按内容指纹认 CA 复制过的 CGImage 这条路是对的，
            但它多留了一张以 UIImage 裸指针为键的指纹缓存 —— 要认的偏偏是 CA 复制出来的 CGImage，
            两者永远对不上；UIImage 释放后指针还会被复用，反而可能把系统图认成我们的（假阳性）。
            0.9.28 删掉这张缓存（`fingerprintCache` 声明/初始化/清理三处一并删），判定改为：先比 CGImage 指针，
            不中再现场算 12×12 灰度指纹比内容。渲染登记处仍把每张合成图（≥40pt）的指纹存进
            `renderedFingerprints`（>600 淘汰一半）。不动角标共用的 `namedMap`/`cachedImageAtPath:` 链。

            v0.9.26（**角标：ourHost 的 contents 也清**，0.9.24 的续作）：0.9.24 只清 `ourHost`
            的底色（backgroundColor / layer.backgroundColor），若系统红底其实画在
            `layer.contents` 里仍会留着。现在补一步：当 ourHost 本身是装着我们那张图的
            `UIImageView` 时，连它的 `layer.contents` 一起清 —— UIKit 会按 `image` 重新渲染，
            我们的图不会丢，混在 contents 里的系统底板会被抹掉。诊断 `sys{}` 新增 `host=N`
            （ourHost 的 contents 被清过几次），装完读它就知道这一步有没有真的发生。

            另：`badge{look=0,hit=0}` 不是「主题素材没接上」——`badge{}` 是角标**背景站**，
            iOS 16.7 上那两个方法不存在，所以恒为 0；真正在用的是 `txt{}`（成图站），
            本机实测 `txt{look=133,hit=133}`、`asset=25x25`（主题 `SBBadgeBG@3x.png` 为 75×75 px）。

            v0.9.25（**布局保存第一步：让枚举自己说话**）：

            1. 0.9.23 装机后读到 `probe=-`、`hooked=0`，而 `tick` 在涨（定时器活着）。
               查源码发现两处「诊断把自己藏了」：
               - `TCPLayoutCandidateClasses()` 只在 `out.count == 0` 时写 probe；
               - `TCPLayoutHookSave()` 只在**挂上了站或跳过了站**时才写 probe。
               于是「找到了类、但一个方法名都没匹配上」会退化成 `probe=-`，看起来像什么都没枚举到。
            2. probe 现在**无条件**写，且先写枚举事实：`cand[model=N,ctrl=M]` ——
               `SBIconModel` 家族找到几个、`SBIconController` 家族找到几个。
            3. 新增**控制器家族**枚举：iOS 16 上把布局写盘的很可能挂在 `SBIconController`，
               原来只扫 `SBIconModel` 家族，这条路整条漏掉。
            4. 新增**宽名单** `near(类)[名字…]`：名字里带 `iconstate/saveicon/persisticon/writeicon/
               storeicon/flush/syncicon/commit` 之一、但没被判据认下的零参数方法也列出来。
               下一次就知道系统那个方法到底叫什么，不用再猜。
            5. 这一版仍**不保证挂上站**：它只负责把「为什么挂不上」变成可读的事实。

            v0.9.24（**角标双层修复**）：诊断 `sys{…,tree=SBDarkeningImageView}` 一直没有 `*`，
            即系统纯色底板从来没被清动过。根因是本机每格角标只有 1 个子视图
            （`backgroundView` = `SBDarkeningImageView`），我们的整图就套在它身上，
            而清理逻辑第一句就把 `target == ourHost` 整条跳过 → 底板永远留在屏幕上。

            1. `target == ourHost` 只跳过「清 `image` / 清 `layer.contents`」（碰这两样会清掉
               我们自己的图），`backgroundColor` 与 `layer.backgroundColor` 照清。
            2. 只有真清动过（`cleared > 0`）才挂「已收拾」标记；没清动就留给下一次布局重试
               —— 原来无条件挂标记，导致「第一次扫时系统底板还没画上来」的格子永久双层，
               正是「一个图标二层、一个图标一层」的来源。
            3. 重试有上限（连续 8 次仍无进展就放弃这一格），且「等不到我们的图」与
               「看到了却清不动」用**两个独立计数**，各自只在自身成功条件达成时归零，
               绝不在 `setText:` / `didMoveToWindow` 清零（那两处在滚动时频繁触发，
               一清零闸门就永开，等于恢复每帧全扫的发热）。
            4. 验收：`sys{…,tree=…*…}` 出现 `*` = 真清动过；仍双层则说明底板与我们那张图
               在同一张 `layer.contents` 里，需下一轮改「图另挂兄弟视图 + 整只隐藏」。

            v0.9.23（**纯诊断版**，逻辑与 0.9.22 完全相同，只为了让「挂不上站」可读）：

            1. 0.9.22 装机实测：`v0.9.22`、`tick` 在涨、`safeskip=0`、无新崩溃 —— **安全模式问题已解决**，
               但布局诊断是 `site=none,model=-,last=noinstance,probe=-`，一个站都没挂上。
            2. `probe=` 现在会说清卡在哪一步：`base=nil`（`objc_getClass("SBIconModel")` 拿不到类）/
               `classlist=0`（`objc_getClassList` 返回 0）/ `base=…,scanned=N,hit=0`（类在、扫描了 N 个、
               沿父链一个都没走到它）。
            3. 诊断末尾多了 `hooked=N` —— **本进程**真正挂上的站数，不受「跨进程 prefs 残留」影响
               （`sav=` 是备份写入次数，不是挂站次数，之前容易看错）。

            v0.9.22（**安全模式修复版**；0.9.21 装上会让 SpringBoard 连崩 5 次进安全模式，已作废、勿装）：

            1. **崩点**：`TCPLayoutInstall()` 在 dyld 构造函数里同步调 `TCPLayoutHookSave()`，后者用
               `objc_getClassList` 枚举**全进程所有类**并逐个发 `-[NSObject isSubclassOfClass:]`
               （崩时寄存器是 `ISOverlayEmbossedFolder`）—— 构造函数阶段 UIKit 还没就绪，消息一进
               转发就 SIGTRAP，dyld 直接 abort，连崩 5 次 → 安全模式。
            2. **判类关系只用 C 函数**：改成 `class_getSuperclass()` 沿父类链往上走，
               对运行时枚举出来的类**一个消息都不发**。
            3. **重活搬出构造函数**：枚举类 + 挂站改到主队列第一拍（2 秒后），构造函数里只剩
               纯赋值、布局恢复与定时器创建。
            4. **启动护栏**：重活前写 `/var/mobile/Library/ThemeCorePlus/.tcp-launch-guard`，跑完删；
               下次启动它还在 = 上次崩在这里 → 整段跳过，诊断写 `safeskip=1`，绝不连崩。
               （要恢复布局功能：删掉这一个文件即可，下次启动会重新尝试。）
            5. **挂站前验真实签名**：零参数 + 返回 void（`method_getTypeEncoding` 以 `v` 开头）才挂，
               签名不符的写进诊断 `probe=…skip[…]`，宁可一个都不挂。
            6. 诊断串末尾多了 `safeskip=0|1`。

            v0.9.21（已作废，勿装）—— 下面 1~4 条修法保留在 0.9.22 里：

            1. **不再猜控制器，直接枚举模型家族**：0.9.20 的诊断是 `lay{...site=-SBIconModel:_saveIconState,
               last=nomodel}` —— 保存站明明挂上了（`sav=1`），但「这个 self 是不是模型」是用
               `respondsToSelector:leafIcons` 判的，系统那个保存方法挂在 `SBIconModel` 上、
               模型并不响应 `leafIcons`，于是永远认不出自己，模型也就永远拿不到。
               0.9.21 改成运行时枚举 `SBIconModel` 家族（含子类）**自己声明的**方法
               （`class_copyMethodList`）：零参数且名字含 `IconState` + `save/persist/write/store`
               的判成保存站，零参数且名字是 `leafIcons/allIcons/icons` 之类的判成图标列表站，
               两类站都挂、**各挂各的槽**（一站一槽，不按 self 的类反查总表），
               从站的 `self` 直接拿到活的模型实例和活的图标数组。
            2. **`last=` 细分成五种**：没类 `noclass` / 有类没实例 `noinstance` /
               有实例但没有零参数保存方法 `nosavemethod` / 调用失败 `forcefail` /
               调用成功 `forced:changed`（下一拍确认真写盘 `forced:wrote`，30 秒没写 `forced:nowrite`）。
               诊断另加 `model=`（模型从哪条路拿到）与 `probe=`（枚举到的候选方法清单）。
            3. **只碰零参数方法**：`method_getNumberOfArguments != 2` 的一个不挂，
               带参数的保存方法（`saveIconStateAndWait:` 之类）绝不调用 —— 挂上去会丢参数、
               把系统写盘弄坏。
            4. **摆位签名用活的图标数组算**：签名直接取图标列表站返回的数组（图标 identifier +
               位置），不再自己再去问模型；签名变了才主动让系统写盘。

            v0.9.20：

            1. **桌面图标布局保存**（用户 2026-10-31 09:07「图标不保存」）：0.9.17 及以前 `lay{tick=0}`
               —— 兜底定时器一次都没跑过（`dispatch_source_t` 在 ARC 下是对象，原来存在
               `TCPLayoutInstall()` 的局部变量里，函数返回即释放、源随之取消）。0.9.18 起存在
               文件级静态变量里、跑主队列，5 秒一拍，`tick` 现在真的在涨。
            2. **0.9.20 修「拿不到活模型」**：0.9.19 装机后 `lay{...tick=13,site=-SBIconModel:_saveIconState,
               last=nomodel}` —— 定时器活了、保存站挂上了，但 `[SBIconController sharedInstance]` +
               `-iconModel` 这条唯一的路在 iOS 16.7 上不通，于是每拍 `nomodel`、`force=0`。
               现在三条退路：① 系统调用保存站时顺手留下 `SBIconModel` 实例；② 控制器上按 KVC 找
               `iconModel` / `model`，再退到它的 `iconManager` 上找；③ 还不行就扫类表找
               `*IconController*`（每 30 秒最多一次）。诊断多了 `model=`，写明是走哪条路拿到的。
            3. **0.9.20 主动保存后确认真写盘**：请求保存前记下源文件 mtime，下一拍比对 ——
               写了记 `forced:wrote`，30 秒还没写记 `forced:nowrite`，不再「以为保存了其实没写」。
               主动保存只调零参数版本（`saveIconState` / `_saveIconState` / `persistIconState`），
               带参数的版本一律不碰。
            4. **恢复「谁新用谁，内容一样一个字节都不动」**：系统那份读得出来且与备份一致 →
               `keepsource`；系统那份不见了/坏了 → 回填；备份比系统那份新 → 回填 `restored:newer`。
               不再无条件覆盖（0.9.16 的老毛病）。
            5. **诊断可核对**：轻量键 `ThemeCorePlusLayout` 每拍现写
               `lay{rst,sav,tick,force,site,model,last}` —— `tick` 必须持续增长，`site=` 写明挂上了
               哪个保存方法（`none` = 没挂上），`last=` 是这一拍干了什么。主诊断里嵌的那条是启动快照，
               只作参考。

            v0.9.11：

            1. **角标只剩一层**：本机（iOS 16.7）的角标只有「成图站」一条路
               （`+[SBIconBadgeView _checkoutImageForText:font:highlighted:]`，底板那两站的方法
               在这台系统上根本不存在，诊断里一直是 `bg{look=0}`），于是交出去的整图自带主题底板，
