               （`SBDarkeningImageView`，底色系统红 `1,0.23,0.19`），而**我们的整图正画在它里面**，
               所以不能把它藏掉（会连自己的图一起藏没），只清它的底色与它自己那张非我们的底图。
               清色动作挂在布局 / 配置数字 / 摆数字图 / 上屏四个回调上；树里一张我们的图都没有时
               先不动，宁可多留一层也绝不把角标清成空白。
               诊断新增 `sys{look,hid,wait,tree}`（`tree` 里带 `*` = 这一层被清过）与 `v{lay,cfg,mv,lo}`。

            2. **时钟与日历图标重新跟着主题走**：0.9.5 曾对 `com.apple.mobiletimer` /
               `com.apple.mobilecal` 一刀切跳过，主题里明明带了素材也永远不加载。
               现在时钟用主题表盘（`ClockIconBackgroundSquare`）当底图、**不画指针** ——
               系统的时钟图标视图自己在表盘上画实时指针；日历只认 `IconBundles` 里的整幅图标
               （`-large`），`Bundles/<id>/icon.png` 那种小图依旧不用，免得又变回「图标不显示」。

