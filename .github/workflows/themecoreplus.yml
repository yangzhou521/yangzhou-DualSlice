# ThemeCorePlus —— 双切片（arm64 + arm64e）deb 的云编译与发布。
#
# 为什么必须是云编译：开发机是 iPhone10,1（A11 / iOS 16.7.16 / roothide），A11 缺 FEAT_LRCPC，
# 装不了任何 Command Line Tools，本机编不出任何东西。macOS runner 上 clang 直编 arm64 + arm64e
# 两片再 lipo，ldid 签名，dpkg-deb 打包，然后在同一次运行里发成 Release。
#
# 版本是静态的：改版本时同时改 scripts/build-themecoreplus.sh 的 VERSION 与下面的 tag。
# 可读的验证信息都写成 check-run 的 annotation（::notice/::error title=…）：job 日志要登录才能看，
# 而公开仓库的 check-run annotations 匿名可读。

name: Build ThemeCorePlus

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    # 只在本产品的文件变动时才跑，别把已经装机验证过的那份 deb 白白重建。
    paths:
      - 'ThemeCorePlus/**'
      - 'Prefs/**'
      - 'Support/ThemeCorePlus*.plist'
      - 'Support/ThemeCorePlus*.png'
      - 'scripts/build-themecoreplus.sh'
      - '.github/workflows/themecoreplus.yml'

permissions:
  contents: write

concurrency:
  group: themecoreplus-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages
  VERSION: 0.8.0

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      # 私有头（vendor/include）与预编的 CydiaSubstrate.framework（vendor/lib）都在这里。
      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Build package
        run: |
          set -o pipefail
          # 打印提交与源码摘要：一次日志要能说清它编的是哪棵树。
          echo "commit: $(git rev-parse HEAD)"
          echo "build-themecoreplus.sh sha256: $(shasum -a 256 scripts/build-themecoreplus.sh)"
          echo "sources sha256:"
          shasum -a 256 ThemeCorePlus/Sources/*.m ThemeCorePlus/Sources/*.h Prefs/ThemeCorePlusPrefs/* | sed 's/^/  /'
          if sh scripts/build-themecoreplus.sh roothide 2>&1 | tee /tmp/tcp-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            # GitHub 每个 step 只留 10 条注解：报错必须压成**一条**多行注解，否则真正的编译错误
            # 会被后面的行挤掉（上一轮就是这么只看到 10 行、剩下的 TU 报什么全不知道）。
            # % → %25、换行 → %0A，都是注解里的转义要求。
            ERRCOUNT=$(grep -cE "error:|fatal error|1 error generated\." /tmp/tcp-build.log || true)
            {
              grep -E "error:|fatal error|1 error generated\." /tmp/tcp-build.log | head -n 25
              echo "--- tail of build log ---"
              tail -n 10 /tmp/tcp-build.log
            } | awk '{ gsub(/%/,"%25"); gsub(/\r/,""); print }' > /tmp/tcp-errs.txt
            BODY=$(awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}' /tmp/tcp-errs.txt)
            echo "::error title=build-themecoreplus errlines=${ERRCOUNT}::${BODY}"
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/themecoreplus/out/ThemeCorePlus.dylib
          PB=build/themecoreplus/out/ThemeCorePlusPrefs
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices-tweak::$(lipo -info "$DY")"
          echo "::notice title=slices-prefs::$(lipo -info "$PB")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-tweak::$lib"
          done
          otool -L "$PB" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-prefs::$lib"
          done
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: themecoreplus-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (themecoreplus-v0.8.0)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        # 仓库的 Actions 权限只读时这里会 403；那样就走下面的匿名托管兜底，不让整轮失败。
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: themecoreplus-v0.8.0
          name: ThemeCorePlus v0.8.0
          body: |
            主题美化 +（ThemeCorePlus）v0.8.0 —— MarkTheme 式的主题引擎，作者 yangzhou。

            v0.8.0 的三件事：

            1. **「刷新图标」不再需要注销。** 面板上点一下就当场重取图：先让系统重新读一遍应用图标，
               再把主屏上所有图标视图推一把（分两轮，0.7 秒后再来一次，专治「第一轮没接住」）。
               碰到怎么推都不重画的图标视图（墙纸/文件夹那种被系统缓存的），就地把它从父视图摘掉
               再装回去，逼它重新取图——只对当时停在主屏、没在被拖动的图标动手。
            2. **角标素材不再变形。** 主题里的 SBBadgeBG@3x.png 是 75×75 像素，本该画在 25pt 的框里，
               可是 UIImage 从文件读图不认文件名里的 @3x，一律当成 1 倍 → 画布被放大到 75pt 再硬塞进
               小框，于是拉伸变形。现在读图时按文件名补回倍率，并且画布严格照素材自己的宽高比来：
               一个字就配正方形画布，两个字符才拉长；素材两头是什么形状（圆角、尖角、异形角标）
               就原样贴两头，绝不套一个圆形或方形上去。
            3. **面板精简成两块** —— 通用（总开关）＋ 主题素材（主题选择、刷新图标）。
               原来的四个功能开关撤掉了：它们缺省就是全开，主题里没对应素材时本来就是空转。
               总开关缺省也是开，只有想临时停用才去关它。
            诊断串里新增角标形状取证：`badge=1;asset=25x25;canvas=25x25;fit=…`，
            `asset` 是素材尺寸、`canvas` 是实际画布尺寸 —— 两者宽高比一致即没变形。

            - 读 SnowBoard / IconBundles 主题**原素材**并现场合成：主屏与文件夹图标、文件夹底板、
              角标底图、系统图片覆盖（设置 / 电话 / 照片 / 共享 / 状态栏）。
            - 多主题叠加：勾选顺序即叠加顺序，靠后的盖住靠前的。
            - 回滚只清配置，不动主题目录里的任何文件。
            - arm64 + arm64e 双切片（A11 用户态是 arm64，只出 arm64e 的 dylib 不会被加载）。
            - roothide 包；rootless 需自己改脚本的第二个参数重编，未经设备验证。
          files: release/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls release/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/themecoreplus-v0.8.0/$(basename "$DEB")"

      - name: Fallback anonymous upload
        if: steps.publish.outcome != 'success'
        run: |
          set -uo pipefail
          for f in release/*.deb; do
            echo "release step did not succeed; uploading $f anonymously"
            url=$(curl -sS --max-time 120 -A "ThemeCorePlus-CI" -F "file=@$f" https://0x0.st || true)
            if [ -z "$url" ] || ! printf '%s' "$url" | grep -q '^https'; then
              echo "0x0st failed, trying catbox"
              url=$(curl -sS --max-time 120 -A "ThemeCorePlus-CI" -F "reqtype=fileupload" -F "fileToUpload=@$f" https://catbox.moe/user/api.php || true)
            fi
            echo "fallback url for $f: $url"
            echo "::notice title=deb-url::$url"
          done
