# CountdownHUD —— 自绘倒计时胶囊的云编译与发布。
#
# 为什么必须云编译：开发机 iPhone10,1（A11）缺 FEAT_LRCPC，装不了 Command Line Tools。
# macOS runner 上 clang 直编 arm64 + arm64e，ldid 签名，dpkg-deb 打包，并在同一次运行里发 Release。
#
# 可读的验证信息写成 check-run annotation（::notice title=…::），公开仓库匿名可读：
#   /repos/{owner}/{repo}/check-runs/{id}/annotations

name: Build CountdownHUD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'CountdownHUD/**'
      - 'Support/CountdownHUD*'
      - 'scripts/build-countdownhud.sh'
      - '.github/workflows/countdownhud.yml'

permissions:
  contents: write

concurrency:
  group: countdownhud-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Checkout
        uses: actions/checkout@v4

      # 只是为了拿 SDK；本插件不链接 substrate，不需要 theos 的 vendor/lib。
      - name: Checkout Theos (for the iPhoneOS SDK)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "source sha256: $(shasum -a 256 CountdownHUD/Sources/*.m)"
          if sh scripts/build-countdownhud.sh roothide 2>&1 | tee /tmp/ch-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            grep -E "error:|error |not found|undefined|ld: |clang: |fatal|No such file|missing" /tmp/ch-build.log \
              | head -n 8 > /tmp/ch-errs.txt || true
            tail -n 12 /tmp/ch-build.log >> /tmp/ch-errs.txt
            while IFS= read -r line; do
              echo "::error title=build-countdownhud::$line"
            done < /tmp/ch-errs.txt
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/countdownhud/out/CountdownHUD.dylib
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices::$(lipo -info "$DY")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link::$lib"
          done
          # 不该有 substrate 依赖：本插件不 hook，链接它只会多一个加载期失败点。
          if otool -L "$DY" | tail -n +2 | grep -qi substrate; then
            echo "::error title=link::unexpected substrate dependency"
            exit 1
          fi
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          dpkg-deb -c "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: countdownhud-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (countdownhud-v1.6.3)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: countdownhud-v1.6.3
          name: CountdownHUD v1.6.3
          body: |
            SpringBoard 侧自绘倒计时胶囊：注销 / 装包前的「N 秒后注销」提示。

            v1.6.3：**诊断串加 `alertWin=…`**。现在「? 注销弹窗」挂在哪个 windowScene 之前
            没有任何记录（诊断里的 `win=…scene=…` 只记胶囊窗口），弹窗能不能显示全靠胶囊窗口
            的场景间接推断。这版把 `gAlertWindow.windowScene` 的类名写进诊断串（`alertWin=`），
            装完发一条 `?` 请求就能直接看到弹窗窗口是不是也挂错了场景。行为其它一律不变。

            v1.6.2：**修「通知只有声音、胶囊看不到」**。旧 CHPickScene 优先取 ForegroundActive 的
            window scene，而 DynamicX 造的假岛（SBSystemApertureWindowScene）一直处于前台，
            于是胶囊窗口被挂到岛场景上 —— 岛场景的窗口不参与主屏幕渲染（或只在岛展开/收起时
            可见性飘忽），用户就「震了（听到）却看不到胶囊」。现在选场景时跳过类名带
            Aperture/Island 的岛场景，优先 SpringBoard 主场景；只有别的一个场景都没有时才退回
            岛场景兜底。诊断里 `win=…scene=…` 装完应看到 scene 不再是 SBSystemApertureWindowScene。

            为什么不靠通知：Apelin 的本地通知在发送瞬间会把 App 拉回前台，横幅被它自己的
            UNUserNotificationCenterDelegate 吞掉，既看不到、也进不了灵动岛。这个插件不碰通知，
            直接在 SpringBoard 顶层窗口画。

            v1.6.1：**点了「立即注销」真的会注销**。以前插件只把 `confirm` 写进
            `/var/mobile/Library/Preferences/.countdownhud-answer`，靠当时还开着的
            `scripts/respring-guard.sh --ask` 读到才执行 —— 脚本一结束（回合结束、超时、被中断），
            用户点下去屏幕上什么都不会发生。现在插件自己在写答案 1 秒后 spawn
            `<jbroot>/usr/bin/sbreload` 注销（找不到就试 `/usr/bin`、`/var/jb/usr/bin`；都不行才给
            SpringBoard 发 SIGTERM 让 launchd 重新拉起）。存在
            `/var/mobile/Library/Preferences/.countdownhud-no-respring` 时只写答案、不注销，
            留给「只倒计时」的测试。诊断串加了 `exec=spawned|skip-marker|term|fail|-`。
            选择主题等别的功能不变。

            v1.6.0：**点一下胶囊，直接跳回发这条消息的对话**。请求文件多一个可选的
            第 4 段：对话 session id（`<epoch>|<秒数>|<标签>|<sid>`，hud-notify.sh 自动填）。
            有它时胶囊只在自身矩形内接收触摸（窗口其余部分照旧返回 nil 穿透，屏幕别处
            一点都不受影响），点一下收起胶囊并用 `apelin://conversation/<sid>` 打开那个对话；
            没有它（老脚本、注销倒计时、`?` 弹窗）行为与 1.5.0 完全一致：不吃任何触摸。
            诊断串末尾多了 `link=<sid>|none` 与 `taps=<累计点击次数>`。
            构造阶段照旧不碰任何 UIKit。

            v1.5.0：**注销前先弹一个系统样式的确认框，让用户自己决定**（用户 2026-10-31
            05:33「以后注销事件给我一个警告⚠️弹窗 让我决定要不注销！」05:35「和 ios 系统桌面
            弹窗一样的弹窗！无论在任何界面有注销事件发生它就给我一个弹窗！」）。
            请求标签以 `?` 开头时不再画胶囊，而是在 SpringBoard 里 present 一个
            UIAlertController（和桌面 / 设置里弹的完全同款：圆角面板 + 毛玻璃 + 两颗按钮），
            标题「⚠️ 即将注销」，按钮「取消」/「立即注销」；窗口层级 30000000，高过一切 App
            与灵动岛，所以任何界面都盖得住。用户点完把结果写进
            `/var/mobile/Library/Preferences/.countdownhud-answer`（`<epoch>|confirm|cancel|timeout`），
            脚本读到 confirm 才真的倒计时 + sbreload；**超时只写 timeout，绝不自动注销**。
            诊断串末尾多了 `alerts=<次数>` 与 `ans=<最近答复>`，`mode=alert` 表示这次是弹窗。
            铁律不变：构造函数阶段不碰任何 UIKit。

            v1.4.2：**震动必须排在 UIKit 就绪之后**。v1.4.1 把生成器改成惰性创建，但「第一次
            真要震时」那一刻往往正是 SpringBoard 刚起来、windowScene 还没拿到的时候 ——
            UISelectionFeedbackGenerator init 仍会走到 +[UIScreen mainScreen]，
            那时 UIKit 尚未初始化完 → 断言 → SIGABRT（真机实测：SpringBoard 启动 0.67 秒后崩，
            连续崩溃计数 2 → 安全模式）。现在改成**先 CHEnsureWindow() 拿到真实 windowScene
            （= UIKit 已经活着）才打震动，然后才画胶囊**：既保住「震动早于倒计时」的次序，
            又绝不在 UIKit 未就绪时碰它。

            铁律：注入 SpringBoard 的插件，构造函数阶段禁止调用任何 UIKit API
            （UIScreen / UIFeedbackGenerator / UIWindow / UIView / UIFont…），
            必须延迟到主线程 + 拿到 windowScene 之后；包 @try 也不够，
            NSAssertionHandler 走的是 abort，不是可捕获异常。

            v1.4.1：**修安全模式**。v1.4.0 在 SpringBoard 的 dyld 构造函数里就创建
            UISelectionFeedbackGenerator，那时 UIKit 还没初始化完 → +[UIScreen mainScreen]
            触发断言抛异常 → SIGABRT → SpringBoard 崩溃循环 → 设备进安全模式。
            现在生成器改成**惰性创建**：第一次真要震的时候（主线程、UIKit 已就绪）才 new，
            构造阶段只做一件安全的事（预热一只已存在的生成器，没有就什么都不做），
            并且整个震动过程包在 @try 里，失败就安静跳过，绝不把桌面搞崩。

            v1.4.0：**注销 / 装包这类要动设备的倒计时，先打一下最弱的震动再画胶囊** ——
            用户要求「有注销的打算时第一时间来一下最弱的震动，而且要早于倒计时」。
            用 UISelectionFeedbackGenerator（系统点选 / 滚轮那一下，全系统最弱的一档）；
            同一请求只震一次（没拿到 windowScene 的重试不重复震），纯文案提醒（`!` 开头）不震。
            诊断串末尾多了 `haptic=<次数>`，不用听声音也能确认震过几次。

            v1.3.0：窗口必须挂在真实的 windowScene 上 —— 老写法在拿不到 scene 时退回
            initWithFrame:，而 iOS 13+ 里那种没有 scene 的窗口根本不参与渲染（诊断里
            shows 照涨、屏幕上却什么都没有），这正是「注销前用户毫不知情」的根因。
            现在拿不到 scene 就不显示、0.5 秒后重试，显示成功才记这条请求已消费；
            诊断串末尾多了 win=<窗口>|scene=…|lvl=… 与 islandWin=…，一眼能看出
            自己的窗口有没有 scene、层级压不压得住岛。

            v1.1.1：胶囊上的文字压到原来的 2/3（高度 ÷ 3，本机 125×37 的岛上约 12.3pt），
            并改成等宽数字 + Medium 字重（数字每秒跳动不再左右抖）；常规文字色由白改为
            系统绿 #34C759，仍是绿 → 橙（剩 3 秒）→ 红（剩 ≤2 秒）。

            v1.1.0：胶囊不再写死 190×44，改为在 SpringBoard 自己的窗口里找灵动岛容器
            （优先 SystemAperture 窗口），按它的 frame 摆放 —— 尺寸与位置和岛一致，
            岛被 VisibleIsland 挪动或 DynamicX 换布局时每秒跟进。

            触发：脚本把 `<epoch>|<秒数>|<标签>` 写进
            `/var/mobile/Library/Preferences/.countdownhud-request`，插件每 0.5 秒轮询一次。

            v1.2.0：同一个胶囊兼作「纯文案」提醒 —— 标签以 `!` 开头时，屏幕上就是这句话本身
            （不显示「N 秒后」前缀、不跳数字、不做绿→橙→红升级），N 秒后淡出。用于任务完成 /
            阶段进度：`sh scripts/hud-notify.sh 8 "完成：…"`。诊断串末尾多了 `mode=plain|count`。

            验证：`icli prefs read com.apple.springboard CountdownHUDDiagnostics`
            （另有 CountdownHUDIslandCandidates 列出量到的候选）。
          files: release/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls release/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/countdownhud-v1.6.3/$(basename "$DEB")"