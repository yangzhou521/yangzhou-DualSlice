# YzThemeCorePlus —— 交付版 ThemeCore+ 5.3.0 的双切片（arm64 + arm64e）deb 云编译与发布。
#
# 为什么必须是云编译：开发机是 iPhone10,1（A11 / iOS 16.7.16 / roothide），A11 缺 FEAT_LRCPC，
# 装不了任何 Command Line Tools，本机编不出任何东西。macOS runner 上 clang 直编 arm64 + arm64e
# 两片再 lipo，ldid 签名，dpkg-deb 打包，然后在同一次运行里发成 Release。
#
# ⚠️ 本工作流与 themecoreplus.yml（自研那条线）**是两个产品**，只是恰好共用一个包名
# （PACKAGE_ID=com.yangzhou.themecoreplus，来自交付件自己的 control）。两者同时装会互相抢挂
# SpringBoard 的同名方法、共用同一份偏好文件 —— 装机前必须跟用户定身份（换 id 或先卸旧），
# 不许一边装一边猜。所以本工作流只负责「编出来」，不替任何人做装机的决定。
#
# 版本是静态的：改版本时同时改 Sources/YzThemeCorePlusVersion.h 的 YZ_THEMECOREPLUS_VERSION、
# scripts/build-yzthemecoreplus.sh 的 VERSION 与下面的 env.VERSION，三处不一致就不编、不发。
# 可读的验证信息都写成 check-run 的 annotation（::notice/::error title=…）：job 日志要登录才能看，
# 而公开仓库的 check-run annotations 匿名可读。

name: Build YzThemeCorePlus

on:
  workflow_dispatch:
    inputs:
      kind:
        description: '编译哪种包（默认 roothide 隐根；rootless 无根版未在设备验证）'
        required: false
        default: 'roothide'
        type: choice
        options:
          - roothide
          - rootless
  push:
    branches:
      - main
      - master
    # 只在本产品的文件变动时才跑，别把已经验过的包白白重建，也别让另一条线（ThemeCorePlus）的
    # 提交触发本工作流。
    paths:
      - 'YzThemeCorePlus/**'
      - 'Support/YzThemeCorePlus*.plist'
      - 'scripts/build-yzthemecoreplus.sh'
      - '.github/workflows/yzthemecoreplus.yml'

permissions:
  contents: write

concurrency:
  group: yzthemecoreplus-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages
  VERSION: 5.3.0

jobs:
  build:
    name: Build YzThemeCorePlus (roothide)
    runs-on: macos-15
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # 与 themecoreplus.yml 一样钉死 16.2：'latest-stable' 每次可能切换 Xcode 大版本并重建索引，
          # 是 macOS runner 上最慢的一步。macos-15 镜像自带 16.2，够编 iOS 16.5 SDK。
          xcode-version: '16.2'

      - name: Checkout
        uses: actions/checkout@v4

      # 私有头（vendor/include/Preferences/*.h）与预编的 CydiaSubstrate.framework（vendor/lib）都在这里。
      # 面板要 <Preferences/PSListController.h>，SDK 里没有这个头，缺了它必然编不过 —— 所以必须 recursive。
      - name: Checkout Theos (roothide fork)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      - name: Verify version consistency
        run: |
          set -euo pipefail
          # tag 必须与包版本一致（2026-10-30 那次只改了脚本、工作流还写着旧 tag，新版 deb
          # 被发进了旧 Release）。这里把它变成硬检查：三处不一致就不编、不发。
          HEADER_VERSION=$(grep -E '^#define YZ_THEMECOREPLUS_VERSION' YzThemeCorePlus/Sources/YzThemeCorePlusVersion.h | sed -E 's/.*"(.*)".*/\1/')
          SCRIPT_VERSION=$(grep -E '^VERSION=' scripts/build-yzthemecoreplus.sh | head -n 1 | cut -d= -f2)
          echo "::notice title=version::header=$HEADER_VERSION script=$SCRIPT_VERSION env=$VERSION"
          for pair in "header:$HEADER_VERSION" "script:$SCRIPT_VERSION"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$VERSION" ]; then
              echo "::error title=version-mismatch::$name=$value 与 env.VERSION=$VERSION 不一致"
              exit 1
            fi
          done
          # 包身份提醒：本产品与自研那条线共用 com.yangzhou.themecoreplus，装之前必须跟用户定身份。
          PKG_ID=$(grep -E '^PACKAGE_ID=' scripts/build-yzthemecoreplus.sh | cut -d= -f2)
          echo "::notice title=package-id::PACKAGE_ID=$PKG_ID —— 与自研 ThemeCorePlus 同名，两者不可同时安装（会抢挂 SpringBoard 同名方法、共用偏好文件）；装机前先与用户定身份"

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "build-yzthemecoreplus.sh sha256: $(shasum -a 256 scripts/build-yzthemecoreplus.sh)"
          echo "sources sha256:"
          shasum -a 256 YzThemeCorePlus/Sources/* YzThemeCorePlus/Hooks/* YzThemeCorePlus/Prefs/* | sed 's/^/  /'
          if sh scripts/build-yzthemecoreplus.sh "${{ inputs.kind || 'roothide' }}" 2>&1 | tee /tmp/yz-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            # GitHub 每个 step 只留 10 条注解：报错必须压成**一条**多行注解，否则真正的编译错误
            # 会被后面的行挤掉（上一轮就是这么只看到 10 行、剩下的 TU 报什么全不知道）。
            # % → %25、换行 → %0A，都是注解里的转义要求。
            ERRCOUNT=$(grep -cE "error:|fatal error|1 error generated\." /tmp/yz-build.log || true)
            {
              grep -E "error:|fatal error|1 error generated\." /tmp/yz-build.log | head -n 25
              echo "--- tail of build log ---"
              tail -n 10 /tmp/yz-build.log
            } | awk '{ gsub(/%/,"%25"); gsub(/\r/,""); print }' > /tmp/yz-errs.txt
            BODY=$(awk 'BEGIN{ORS=""} NR>1{printf "%%0A"} {print}' /tmp/yz-errs.txt)
            echo "::error title=build-yzthemecoreplus errlines=${ERRCOUNT}::${BODY}"
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          DY=build/yzthemecoreplus/out/YzThemeCorePlus.dylib
          PB=build/yzthemecoreplus/out/YzThemeCorePlusPrefs
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=slices-tweak::$(lipo -info "$DY")"
          echo "::notice title=slices-prefs::$(lipo -info "$PB")"
          otool -L "$DY" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-tweak::$lib"
          done
          otool -L "$PB" | tail -n +2 | awk '{print $1}' | while read -r lib; do
            echo "::notice title=link-prefs::$lib"
          done
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}') bytes=$(stat -f%z "$DEB")"
          # 包名里的版本与 control 里的版本也一起核对：deb 名错了会让装机的人抓错文件。
          DEBVER=$(dpkg-deb -f "$DEB" Version)
          echo "::notice title=deb-version::$DEBVER"
          if [ "$DEBVER" != "$VERSION" ] || ! echo "$(basename "$DEB")" | grep -q "_${VERSION}_"; then
            echo "::error title=version-mismatch::deb=$(basename "$DEB") 版本=$DEBVER 期望=$VERSION"
            exit 1
          fi
          echo "=== deb contents ==="
          dpkg-deb -c "$DEB"

      - name: Publish release
        id: publish
        # 仓库的 Actions 权限只读时这里会 403；那样就走下面的匿名托管兜底，不让整轮失败。
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: yzthemecoreplus-v${{ env.VERSION }}${{ inputs.kind == 'rootless' && '-rootless' || '' }}
          name: YzThemeCorePlus (ThemeCore+) v${{ env.VERSION }}${{ inputs.kind == 'rootless' && ' (rootless)' || '' }}
          body: |
            交付版 **ThemeCore+ 5.3.0**（作者 yangzhou）移植进本仓库后的云编译产物 —— **纯 ObjC 直编**
            （clang arm64 + arm64e 双切片 + lipo + ldid + dpkg-deb），不走 Theos 构建规则。

            这是什么：轻量化桌面图标主题插件，修改图标、图标角标及图标阴影如此轻松，覆盖绝大部分区域，
            时钟日历可动态图标；rootless / roothide 均可，
            iOS 15+，只注入 SpringBoard。原始交付件是 Theos 工程（`YzThemeCorePlus/`，`Hooks/*.m` +
            `Sources/*.m` + `Prefs/*.m`），本仓库只做「移植 + 云编译」，**不动它的业务逻辑**。

            ⚠️ **包身份与自研的那条线同名**：`com.yangzhou.themecoreplus`（交付件 `control` 里原本就是它）。
            两者同时安装会互相抢挂 SpringBoard 的同名方法、共用同一份偏好文件。装之前必须先定身份
            （换 id 或先卸掉旧的），不许一边装一边猜。

            - 双切片：arm64（A11 用户态就是它）+ arm64e，缺一不可。
            - 面板 `YzThemeCorePlusPrefs` 装进 `/Library/PreferenceBundles/`，入口在
              `/Library/PreferenceLoader/Preferences/YzThemeCorePlus.plist`（设置里那一行叫「ThemeCore+」）。
            - 插件 `YzThemeCorePlus.dylib` 装进 `/Library/MobileSubstrate/DynamicLibraries/`，
              过滤器只进 `com.apple.springboard`。
            - 本机（iPhone10,1 / iOS 16.7.16 / roothide）到手后先看本工作流的 annotations（匿名可读），
              再决定装不装；装包与注销都要用户点头。
          files: packages/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/yzthemecoreplus-v${{ env.VERSION }}${{ inputs.kind == 'rootless' && '-rootless' || '' }}/$(basename "$DEB")"

      - name: Fallback anonymous upload
        if: steps.publish.outcome != 'success'
        run: |
          set -uo pipefail
          for f in packages/*.deb; do
            echo "release step did not succeed; uploading $f anonymously"
            url=$(curl -sS --max-time 120 -A "YzThemeCorePlus-CI" -F "file=@$f" https://0x0.st || true)
            if [ -z "$url" ] || ! printf '%s' "$url" | grep -q '^https'; then
              echo "0x0st failed, trying catbox"
              url=$(curl -sS --max-time 120 -A "YzThemeCorePlus-CI" -F "reqtype=fileupload" -F "fileToUpload=@$f" https://catbox.moe/user/api.php || true)
            fi
            echo "fallback url for $f: $url"
            echo "::notice title=deb-url::$url"
          done
