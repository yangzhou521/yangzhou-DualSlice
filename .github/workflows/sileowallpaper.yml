# SileoWallpaper 合并包 —— 云编译与发布。
#
# 一个包（com.sileowallpaper.tweak）：原壁纸 dylib（OriginalPlugin/ 里的二进制，逐字节不改）
# ＋ 现场编译的 SileoFix.dylib（修 Sileo 搜索框打不了字）。
# 开发机 iPhone10,1（A11）没有工具链，一切走 macOS runner：clang 直编 arm64 + arm64e，
# ldid 签名，dpkg-deb 打包，并在同一次运行里发 Release。

name: Build SileoWallpaper (merged)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'OriginalPlugin/**'
      - 'SileoFix/**'
      - 'Support/SileoFix*'
      - 'scripts/build-sileowallpaper.sh'
      - '.github/workflows/sileowallpaper.yml'

permissions:
  contents: write

concurrency:
  group: sileowallpaper-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos
  SDKROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk
  APELIN_PACKAGE_DIR: packages

jobs:
  build:
    name: Build (roothide)
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout
        uses: actions/checkout@v4

      # 拿 SDK 和 vendor（libsubstrate）。
      - name: Checkout Theos (for the iPhoneOS SDK and substrate)
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos
          submodules: recursive

      - name: Install iOS SDK (iPhoneOS16.5, headerless)
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if [ -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "iPhoneOS16.5.sdk already present"
            exit 0
          fi
          SDK_STAGE="$(mktemp -d)"
          trap 'rm -rf "$SDK_STAGE"' EXIT
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$SDK_STAGE/sdks"
          git -C "$SDK_STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "$SDK_STAGE/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls -1 "$THEOS/sdks"

      - name: Install build tools
        run: brew install ldid dpkg

      # 版本两处必须一致：修复源码的 SW_VERSION 与脚本的 FIX_VERSION；
      # 包版本与 tag 也必须一致（历史上 v0.9.3 那次就因为 tag 没跟着改，把新包发进了旧 Release）。
      - name: Version consistency
        run: |
          set -euo pipefail
          FIX_SRC=$(sed -n 's/^#define SW_VERSION "\(.*\)"/\1/p' SileoFix/Sources/SileoFix.m)
          FIX_SH=$(sed -n 's/^FIX_VERSION=\(.*\)$/\1/p' scripts/build-sileowallpaper.sh)
          PKG_SH=$(sed -n 's/^VERSION=\(.*\)$/\1/p' scripts/build-sileowallpaper.sh)
          WF_V=$(sed -n 's/^          tag_name: sileowallpaper-v\(.*\)$/\1/p' .github/workflows/sileowallpaper.yml)
          echo "fix_src=$FIX_SRC fix_sh=$FIX_SH pkg_sh=$PKG_SH tag=$WF_V"
          if [ -z "$FIX_SRC" ] || [ "$FIX_SRC" != "$FIX_SH" ]; then
            echo "::error title=fix-version-mismatch::SW_VERSION=$FIX_SRC FIX_VERSION=$FIX_SH"
            exit 1
          fi
          if [ -z "$PKG_SH" ] || [ "$PKG_SH" != "$WF_V" ]; then
            echo "::error title=package-version-mismatch::VERSION=$PKG_SH tag=$WF_V"
            exit 1
          fi
          echo "::notice title=versions::package=$PKG_SH sileofix=$FIX_SRC"

      - name: Build package
        run: |
          set -o pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "OriginalPlugin sha256 (仓库里那份): $(shasum -a 256 OriginalPlugin/SileoWallpaper.dylib | awk '{print $1}')"
          echo "SileoFix source sha256: $(shasum -a 256 SileoFix/Sources/*.m)"
          if sh scripts/build-sileowallpaper.sh roothide 2>&1 | tee /tmp/sw-build.log; then
            echo "=== .deb files ==="
            find ./packages -name "*.deb" -type f
          else
            grep -E "error:|error |not found|undefined|ld: |clang: |fatal|No such file|missing" /tmp/sw-build.log \
              | head -n 8 > /tmp/sw-errs.txt || true
            tail -n 12 /tmp/sw-build.log >> /tmp/sw-errs.txt
            while IFS= read -r line; do
              echo "::error title=build-sileowallpaper::$line"
            done < /tmp/sw-errs.txt
            exit 1
          fi

      - name: Verify and report
        run: |
          set -euo pipefail
          echo "::notice title=commit::$(git rev-parse HEAD)"
          echo "::notice title=fix-slices::$(lipo -info build/sileowallpaper/out/SileoFix.dylib)"
          echo "::notice title=wallpaper-slices::$(lipo -info build/sileowallpaper/out/SileoWallpaper.dylib)"
          DEB=$(ls packages/*.deb | head -n 1)
          echo "::notice title=deb::$(basename "$DEB") sha256=$(shasum -a 256 "$DEB" | awk '{print $1}')"
          echo "::notice title=deb-size::$(stat -f%z "$DEB") bytes"
          dpkg-deb -c "$DEB"
          # 原插件必须是逐字节原样：从包里解出来跟仓库里那份比 sha256。
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          dpkg-deb -x "$DEB" /tmp/unpack
          A=$(shasum -a 256 OriginalPlugin/SileoWallpaper.dylib | awk '{print $1}')
          B=$(shasum -a 256 /tmp/unpack/Library/MobileSubstrate/DynamicLibraries/SileoWallpaper.dylib | awk '{print $1}')
          echo "::notice title=wallpaper-sha::repo=$A deb=$B"
          if [ "$A" != "$B" ]; then
            echo "::error title=wallpaper-binary-changed::打包时原插件二进制被改了"
            exit 1
          fi
          echo "::notice title=ok::原插件二进制逐字节一致，含 SileoFix $(sed -n 's/^#define SW_VERSION "\(.*\)"/\1/p' SileoFix/Sources/SileoFix.m)"
          dpkg-deb -I "$DEB"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sileowallpaper-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Release (sileowallpaper-v0.1.9)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: sileowallpaper-v0.1.9
          name: SileoWallpaper 0.1.9（含搜索框修复）
          body: |
            **这是一个合并包**：原来的壁纸插件 `com.sileowallpaper.tweak` 与独立的
            `com.yangzhou.sileofix` 合成一个包，装上就等于「壁纸 + 修复」两件都有，
            不必再单独装修复包（装了旧修复包的会被本包替换掉）。

            包内两个 dylib，各自注入 `org.coolstar.SileoStore`：

            | 文件 | 作用 |
            | --- | --- |
            | `SileoWallpaper.dylib` | 原壁纸插件本体，二进制逐字节未改（相册选图、文字颜色、背景柔化、列表底色） |
            | `SileoFix.dylib` | 本次修复：让 Sileo 的输入框重新能用 |

            ## 修的是什么

            SileoWallpaper 把源内页与软件源页的 `UINavigationBar` 设成了
            `userInteractionEnabled = NO`，而「搜索软件包」输入框与左边「所有分类」
            按钮都挂在这条导航栏上，于是整片变成死区：点了没反应、键盘不弹、打不了字。
            导航栏只有 44 高时，搜索栏溢出的部分连 `pointInside` 都过不去。
            同一时刻「已安装」页的导航栏是可交互的，所以那里一直点得动。

            修复给 `UINavigationBar` 加了一条 `hitTest:withEvent:` 旁路：点在它自己的
            `UISearchBar` / `UIControl` 上就接管，别处照旧穿透，壁纸与列表行为不变。

            v1.0.4 之前的两次事故也一并记在这里：v1.0.1 的 `UITextField` 与
            `UISearchBar` 共用了一个原 IMP 槽，第二站覆盖了第一站的实现，
            文本框移动窗口时执行到 search bar 的实现就崩（点底栏「软件包」即闪退）；
            v1.0.2 起改成一站一槽。

            ## 装机

            装完**划掉 Sileo 后台再打开**即生效（注入型插件随目标进程启动加载，不用注销桌面）。

            诊断：`icli log syslog --subsystem com.yangzhou.sileofix`，
            或读 Sileo 沙盒里的 `Caches/sileofix.log`（每次加载清空，首行是 `loaded v…`）。
          files: release/*.deb

      - name: Report release URL
        if: steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          DEB=$(ls release/*.deb | head -n 1)
          echo "::notice title=deb-url::https://github.com/${{ github.repository }}/releases/download/sileowallpaper-v0.1.9/$(basename "$DEB")"
